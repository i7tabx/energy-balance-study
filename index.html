<script>
  try { var t = localStorage.getItem('eb_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try { var m = localStorage.getItem('eb_mode'); document.documentElement.dataset.mode = m || 'quiz'; } catch (e) { document.documentElement.dataset.mode = 'quiz'; }

  <button class="iconbtn" id="menuBtn" aria-label="القائمة">
